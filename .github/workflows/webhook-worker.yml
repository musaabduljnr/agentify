name: Webhook Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger webhook worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://agentifychat.online/api/webhooks/worker' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$WORKER_URL"
